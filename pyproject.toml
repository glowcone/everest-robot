[project]
name = "everest-robot"
version = "0.1.0"
description = "A durable robot workflow scaffold built with Absurd"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "absurd-sdk>=0.2.0",
    # Replay reads a pinned LeRobot v3 snapshot directly: parquet columns and info.json.
    # That keeps dataset replay off the torch stack, which has no business running on a
    # robot control host just to read joint angles.
    "huggingface-hub>=0.30",
    "numpy>=2.0",
    "opencv-python>=5.0",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real robot hardware and the LeRobot policy/dataset stack. Everything under
# ``everest_robot.robot`` imports these lazily, so the core package, its tests, and the
# deterministic fakes all work without this extra installed.
hardware = [
    "lerobot[maker]",
    "maker-arm",
]

[project.scripts]
robot-worker = "everest_robot.worker:main"
robot-attach-fsm = "everest_robot.fsm_cli:main"
robot-raise = "everest_robot.jog:main"
robot-goto = "everest_robot.goto:main"
robot-start = "everest_robot.client:start"
robot-replay = "everest_robot.client:start_replay"
robot-replay-preflight = "everest_robot.client:replay_preflight"
robot-config = "everest_robot.client:show_config"
robot-monitor = "everest_robot.monitor:main"
robot-pixel-map = "everest_robot.calibrate_pixel_map:main"
robot-db = "everest_robot.database:main"
robot-db-init = "everest_robot.database:init"
robot-two-white-black-debug = "everest_robot.two_white_black_debug:main"
robot-two-white-black-live = "everest_robot.two_white_black_live:main"

[dependency-groups]
dev = [
    "absurdctl>=0.5.0",
    "pytest>=8.3",
    "ruff>=0.11",
]

# Pinned to immutable commit SHAs: a moving branch would silently change the production
# hardware safety boundary. Update a revision deliberately and commit the resulting uv.lock.
[tool.uv.sources]
lerobot = { git = "https://github.com/makermods-robotics/lerobot.git", rev = "af9072a8ca4b1767ef25b98eed1149d1bbf89f46" }
maker-arm = { git = "https://github.com/makermods-robotics/maker-arm-sdk.git", rev = "8d3998d774650c239bc1b42f73c3f7d569e2c59d" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
